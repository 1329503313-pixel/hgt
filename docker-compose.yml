services:
  hgt:
    build: .
    image: hgt:latest
    container_name: hgt-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - WEB_ORIGIN=${WEB_ORIGIN:?WEB_ORIGIN must be set}
      - APP_ORIGIN=${APP_ORIGIN:-https://app.caqis.com}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:?PUBLIC_SITE_URL must be set}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD must be set}
      - DB_HOST=mysql-docker-mysql-1
      - DB_PORT=3306
      - DB_USER=hgt
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=hgt
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - EMAIL_VERIFICATION_SECRET=${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET must be set}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:?SMTP_USER must be set}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM must be set}
      - SMTP_REPLY_TO=${SMTP_REPLY_TO:-}
      - RUN_DB_MIGRATIONS=${RUN_DB_MIGRATIONS:-true}
      - ASSET_MEDIA_DIR=/app/data/asset-media
      - ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT:?ALIYUN_OSS_ENDPOINT must be set}
      - ALIYUN_OSS_REGION=${ALIYUN_OSS_REGION:?ALIYUN_OSS_REGION must be set}
      - ALIYUN_OSS_BUCKET=${ALIYUN_OSS_BUCKET:?ALIYUN_OSS_BUCKET must be set}
      - ALIYUN_OSS_KEY_PREFIX=${ALIYUN_OSS_KEY_PREFIX:?ALIYUN_OSS_KEY_PREFIX must be set}
      - ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID:?ALIYUN_OSS_ACCESS_KEY_ID must be set}
      - ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET:?ALIYUN_OSS_ACCESS_KEY_SECRET must be set}
    volumes:
      - hgt_asset_media:/app/data/asset-media
    networks:
      - mysql-docker_default

networks:
  mysql-docker_default:
    external: true

volumes:
  hgt_asset_media:
