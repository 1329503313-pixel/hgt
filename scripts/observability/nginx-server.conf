# Include in each HGT server {}; also in locations overriding access_log.
# Keep existing access/error logs for recovery if the UDP collector is stopped.
access_log syslog:server=127.0.0.1:15140,facility=local7,tag=hgt_access,nohostname hgt_request_json;
# Nginx generates this ID, including errors that never reach the application.
# If a location has add_header directives, repeat these there as appropriate.
add_header X-Request-Id $request_id always;
proxy_hide_header X-Request-Id;
