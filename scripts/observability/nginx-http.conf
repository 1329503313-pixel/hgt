# Include ONCE inside http {}, before site configuration. No authentication,
# proxy timeout, TLS or routing settings are changed by these snippets.
map $request_uri $hgt_log_path {
    ~^([^?]*) $1;
}
log_format hgt_request_json escape=json
    '{"time":"$time_iso8601","requestId":"$request_id",'
    '"method":"$request_method","path":"$hgt_log_path",'
    '"status":"$status","requestTime":"$request_time",'
    '"upstreamConnectTime":"$upstream_connect_time",'
    '"upstreamHeaderTime":"$upstream_header_time",'
    '"upstreamResponseTime":"$upstream_response_time",'
    '"upstreamStatus":"$upstream_status",'
    '"contentType":"$sent_http_content_type",'
    '"connection":"$connection","connectionRequests":"$connection_requests"}';
