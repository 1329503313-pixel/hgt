<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>网络暂时不可用｜汤物语丨汤汤解谜乐园</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background: #f3f8f5; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 28px 24px; border: 1px solid #dbe5df; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 18px 48px rgba(23, 32, 51, .10); }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { margin: 18px 0 8px; font-size: 24px; line-height: 1.35; }
      p { margin: 0; color: #64748b; font-size: 16px; line-height: 1.65; }
      button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 14px; background: #2563eb; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="汤物语" />
      <h1>网络暂时不可用</h1>
      <p>恢复网络后重新尝试。聊天、账号和海龟汤内容不会使用旧缓存。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
